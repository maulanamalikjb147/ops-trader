apiVersion: v1
kind: Secret
metadata:
  name: signal-bot-secrets
  namespace: signal-bot
type: Opaque
stringData:
  # ── MongoDB ─────────────────────────────────────────────────────────────────
  # For MongoDB Atlas:
  # MONGO_URL: "mongodb+srv://user:pass@cluster.mongodb.net/signal_bot"
  # For self-managed MongoDB with auth:
  MONGO_URL: "mongodb://admin:CHANGE_ME_MONGO_PASS@mongodb-service:27017/signal_bot?authSource=admin"
  DB_NAME: "signal_bot"

  # ── Redis ────────────────────────────────────────────────────────────────────
  # For Redis Cloud / Upstash:
  # REDIS_URL: "redis://:CHANGE_ME_REDIS_PASS@your-host.upstash.io:6379"
  # For self-managed Redis with auth:
  REDIS_URL: "redis://:CHANGE_ME_REDIS_PASS@redis-service:6379"

  # ── Auth ─────────────────────────────────────────────────────────────────────
  # Generate: python3 -c "import secrets; print(secrets.token_hex(32))"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_64_CHARS_HEX"
  ADMIN_USERNAME: "opsculun"
  ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
  ENCRYPTION_KEY: "CHANGE_ME_32CHAR_ENCRYPTION_KEY_"

  # ── CORS ─────────────────────────────────────────────────────────────────────
  CORS_ORIGINS: "https://yourdomain.com"
  FRONTEND_URL: "https://yourdomain.com"

---
# ── MongoDB credentials (for the MongoDB StatefulSet) ─────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secrets
  namespace: signal-bot
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "CHANGE_ME_MONGO_PASS"
  MONGO_INITDB_DATABASE: "signal_bot"

---
# ── Redis password ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: signal-bot
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASS"
