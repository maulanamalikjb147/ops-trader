apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: signal-bot
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_REGISTRY/signal-bot-frontend:latest
          # ↑ Replace with your Docker registry image
          # This image must be built with the correct REACT_APP_BACKEND_URL
          # docker build --build-arg REACT_APP_BACKEND_URL=https://yourdomain.com ...
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
