apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: signal-bot
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: signal-bot
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
  # For direct access without ingress, change to:
  # type: LoadBalancer
  # or: type: NodePort
